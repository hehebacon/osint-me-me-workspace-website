name = "diw-advanced"
main = "worker/index.ts"
compatibility_date = "2026-10-26"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "osint-me"
database_id = "46a1869b-82e5-49d4-9be2-1783eb663691"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "diw-evidence"

[vars]
MAX_UPLOAD_BYTES = "10485760"
