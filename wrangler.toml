# Replace database_id with the ID created in your Cloudflare account.
name = "diw-advanced"
main = "worker/index.ts"
compatibility_date = "2026-10-26"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "diw-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "diw-evidence"

[vars]
MAX_UPLOAD_BYTES = "10485760"
# Configure secrets separately; do not commit real values:
# ACCESS_TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
# ACCESS_AUD = "your-access-application-aud-tag"
# ADMIN_EMAILS = "you@example.com"
