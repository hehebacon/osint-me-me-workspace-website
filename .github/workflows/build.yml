name: Build and deploy DIW Advanced

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'worker/**'
      - 'src/**'
      - 'migrations/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diw-advanced-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" >&2; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" >&2; exit 1)
          test -n "$ACCESS_TEAM_DOMAIN" || (echo "Missing ACCESS_TEAM_DOMAIN secret" >&2; exit 1)
          test -n "$ACCESS_AUD" || (echo "Missing ACCESS_AUD secret" >&2; exit 1)
          test -n "$ADMIN_EMAILS" || (echo "Missing ADMIN_EMAILS secret" >&2; exit 1)
          test -n "$GITHUB_TOKEN" || (echo "Missing GITHUB_TOKEN secret" >&2; exit 1)

      - name: Install Wrangler
        run: npm install

      - name: Configure Cloudflare Access secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$ACCESS_TEAM_DOMAIN" | npx wrangler secret put ACCESS_TEAM_DOMAIN
          printf '%s' "$ACCESS_AUD" | npx wrangler secret put ACCESS_AUD
          printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS
          printf '%s' "$GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN

      - name: Run build.sh (D1 + build + deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash build.sh
